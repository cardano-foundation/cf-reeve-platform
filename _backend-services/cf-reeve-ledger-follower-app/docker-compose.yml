services:

  postgres-follower:
    image: postgres:17
    command: -p 5433
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5433:5433"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres -p 5433 -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - lob

  follower-app:
    build:
      context: .
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "9090:9090"
    environment:
      SPRING_PROFILES_ACTIVE: dev--yaci-dev-kit
      DB_URL: ${DB_USER:-jdbc:postgresql://postgres-follower:5433/postgres?currentSchema=lob_follower_service}
      LOB_BLOCKFROST_URL: http://yaci-cli:8080/api/v1/
      STORE_CARDANO_HOST: yaci-cli
      SOTRE_CARDANO_PORT: 3001
      STORE_CARDANO_PROTOCOL_MAGIC: 42
      LOB_UTXO_FILTER_ADDRESSES: addr_test1qppcuzs25ghufz2mzg37hcm77px4matwz2hz072z4ms7umqasylaf2uure0h5dw6zmm4ctnxfm0m9gf8lst6fflthlhq5hrg7w
    depends_on:
      postgres-follower:
        condition: service_healthy
    networks:
      - lob

  yaci-cli:
    image: bloxbean/yaci-cli:0.10.6
    env_file:
      - ./yaci-config/env
      - ./yaci-config/node.properties
    volumes:
      - ./yaci-config/node.properties:/app/config/node.properties
      - yaci-data:/clusters
    ports:
      - "3001:3001"
      - "8082:8080"
    entrypoint: [ "/app/yaci-cli", "create-node", "-o", "--start" ]
    networks:
      - lob
  yaci-viewer:
    image: bloxbean/yaci-viewer:0.10.6
    ports:
      - "5173:5173"
    env_file:
      - ./yaci-config/env
    environment:
      PUBLIC_INDEXER_BASE_URL: ${PUBLIC_INDEXER_BASE_URL:-http://yaci-cli:8080/api/v1}
      PUBLIC_INDEXER_WS_URL: ${PUBLIC_INDEXER_WS_URL:-ws://localhost:8082/ws/liveblocks}
    networks:
      - lob
volumes:
  postgres-data:
  yaci-data:
networks:
  lob:
    name: lob

